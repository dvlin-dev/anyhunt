use_default_settings: true

general:
  instance_name: Anyhunt Search
  debug: false

search:
  safe_search: 1
  autocomplete: ''
  formats:
    - html
    - json

server:
  bind_address: 0.0.0.0
  port: 8080
  limiter: false
  method: GET
  image_proxy: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
